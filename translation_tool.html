<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Language Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for modern, clean iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 text-slate-800">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 flex flex-col h-[90vh] sm:h-auto">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-5 flex items-center gap-3">
            <i class="ph ph-translate text-white text-3xl"></i>
            <h1 class="text-2xl font-bold text-white tracking-tight">LinguaConnect</h1>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col md:flex-row h-full">
            
            <!-- Source Section -->
            <div class="flex-1 flex flex-col p-6 border-b md:border-b-0 md:border-r border-slate-200">
                <div class="mb-4">
                    <label for="sourceLang" class="block text-sm font-medium text-slate-500 mb-2">Translate from</label>
                    <div class="relative">
                        <select id="sourceLang" class="block w-full sm:w-1/2 appearance-none bg-slate-50 border border-slate-200 text-slate-700 py-2.5 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all cursor-pointer font-medium">
                            <option value="en" selected>English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="hi">Hindi</option>
                            <option value="zh">Chinese</option>
                            <option value="ja">Japanese</option>
                            <option value="ar">Arabic</option>
                            <option value="ru">Russian</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 sm:right-[50%]">
                            <i class="ph-bold ph-caret-down"></i>
                        </div>
                    </div>
                </div>

                <div class="relative flex-1 flex flex-col min-h-[200px]">
                    <textarea id="inputText" placeholder="Type or paste your text here..." class="flex-1 w-full resize-none border-none outline-none text-lg lg:text-xl text-slate-700 placeholder-slate-400 bg-transparent focus:ring-0 p-0 mb-4" spellcheck="false"></textarea>
                    
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                        <span id="charCount" class="text-xs font-medium text-slate-400">0 characters</span>
                        <button id="translateBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-6 rounded-xl transition-colors shadow-sm hover:shadow flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                            <span id="btnText">Translate</span>
                            <i id="btnIcon" class="ph-bold ph-arrow-right"></i>
                            <div id="btnLoader" class="loader hidden"></div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Target Section -->
            <div class="flex-1 flex flex-col p-6 bg-slate-50/50">
                <div class="mb-4 flex items-end justify-between">
                    <div class="w-full">
                        <label for="targetLang" class="block text-sm font-medium text-slate-500 mb-2">Translate to</label>
                        <div class="relative">
                            <select id="targetLang" class="block w-full sm:w-1/2 appearance-none bg-white border border-slate-200 text-slate-700 py-2.5 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all cursor-pointer font-medium">
                                <option value="en">English</option>
                                <option value="es" selected>Spanish</option>
                                <option value="fr">French</option>
                                <option value="de">German</option>
                                <option value="hi">Hindi</option>
                                <option value="zh">Chinese</option>
                                <option value="ja">Japanese</option>
                                <option value="ar">Arabic</option>
                                <option value="ru">Russian</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 sm:right-[50%]">
                                <i class="ph-bold ph-caret-down"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="relative flex-1 flex flex-col min-h-[200px]">
                    <!-- Output Textarea used to facilitate easy copying and natural flow -->
                    <textarea id="outputText" readonly placeholder="Translation will appear here..." class="flex-1 w-full resize-none border-none outline-none text-lg lg:text-xl text-slate-800 placeholder-slate-400 bg-transparent focus:ring-0 p-0 mb-4 selection:bg-indigo-100"></textarea>
                    
                    <!-- Error Message Container -->
                    <div id="errorContainer" class="hidden absolute top-0 left-0 right-0 bg-red-50 text-red-600 text-sm px-4 py-3 rounded-xl border border-red-100 flex items-center gap-2">
                        <i class="ph-fill ph-warning-circle text-lg"></i>
                        <span id="errorMessage">Translation failed. Please try again.</span>
                    </div>

                    <div class="flex items-center gap-2 mt-auto pt-4 border-t border-slate-100">
                        <button id="copyBtn" class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg transition-colors font-medium text-sm" title="Copy to clipboard">
                            <i class="ph ph-copy text-lg"></i> Copy
                        </button>
                        <button id="listenBtn" class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg transition-colors font-medium text-sm" title="Listen to translation">
                            <i class="ph ph-speaker-high text-lg"></i> Listen
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Hidden input for clipboard fallback -->
    <input type="text" id="clipboardFallback" class="absolute -left-[9999px] opacity-0" aria-hidden="true">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputText = document.getElementById('inputText');
            const outputText = document.getElementById('outputText');
            const sourceLang = document.getElementById('sourceLang');
            const targetLang = document.getElementById('targetLang');
            const translateBtn = document.getElementById('translateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const listenBtn = document.getElementById('listenBtn');
            const charCount = document.getElementById('charCount');
            
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');
            const clipboardFallback = document.getElementById('clipboardFallback');

            // Character count updater
            inputText.addEventListener('input', () => {
                const count = inputText.value.length;
                charCount.textContent = `${count} character${count !== 1 ? 's' : ''}`;
            });

            // Set loading state UI
            const setLoading = (isLoading) => {
                translateBtn.disabled = isLoading;
                if (isLoading) {
                    btnText.textContent = 'Translating...';
                    btnIcon.classList.add('hidden');
                    btnLoader.classList.remove('hidden');
                    errorContainer.classList.add('hidden');
                } else {
                    btnText.textContent = 'Translate';
                    btnIcon.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                }
            };

            // Show Error
            const showError = (msg) => {
                errorMessage.textContent = msg;
                errorContainer.classList.remove('hidden');
                outputText.value = ''; // Clear output on error
                
                // Hide error after 5 seconds
                setTimeout(() => {
                    errorContainer.classList.add('hidden');
                }, 5000);
            };

            // Main Translate Function
            const translateText = async () => {
                const text = inputText.value.trim();
                if (!text) {
                    // Flash the input area slightly to indicate it's empty
                    inputText.classList.add('bg-slate-100');
                    setTimeout(() => inputText.classList.remove('bg-slate-100'), 300);
                    return;
                }

                const source = sourceLang.value;
                const target = targetLang.value;
                const encodedText = encodeURIComponent(text);
                const url = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=${source}|${target}`;

                setLoading(true);

                try {
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.responseStatus === 200) {
                        outputText.value = data.responseData.translatedText;
                    } else {
                        // API specific error or quota exceeded
                        showError(data.responseDetails || 'Translation error occurred. You might have exceeded the daily limit.');
                    }
                } catch (error) {
                    console.error('Translation Fetch Error:', error);
                    showError('Network error. Please check your connection and try again.');
                } finally {
                    setLoading(false);
                }
            };

            // Handle translate button click
            translateBtn.addEventListener('click', translateText);

            // Optional: Translate on Ctrl+Enter
            inputText.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    translateText();
                }
            });

            // Copy to Clipboard (using execCommand for maximum compatibility in constrained environments)
            copyBtn.addEventListener('click', () => {
                const textToCopy = outputText.value;
                if (!textToCopy) return;

                try {
                    // Method 1: Using the textarea itself
                    outputText.select();
                    outputText.setSelectionRange(0, 99999); // For mobile devices
                    document.execCommand('copy');
                    
                    // Clear selection visually
                    window.getSelection().removeAllRanges();

                    // Visual feedback
                    const originalIcon = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="ph-bold ph-check text-green-500 text-lg"></i> Copied!';
                    copyBtn.classList.add('text-green-600', 'bg-green-50');
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalIcon;
                        copyBtn.classList.remove('text-green-600', 'bg-green-50');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    alert('Copy failed. Please manually select and copy the text.'); // Fallback native alert is specifically disallowed, so we use UI instead.
                    showError("Could not copy text to clipboard.");
                }
            });

            // Text-to-Speech (Web Speech API)
            listenBtn.addEventListener('click', () => {
                const textToSpeak = outputText.value;
                if (!textToSpeak) return;

                if (!('speechSynthesis' in window)) {
                    showError("Sorry, your browser doesn't support text-to-speech.");
                    return;
                }

                // Visual feedback during speech
                listenBtn.innerHTML = '<i class="ph-bold ph-speaker-high text-blue-600 text-lg animate-pulse"></i> Playing...';
                
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = targetLang.value;
                
                // Reset button when finished
                utterance.onend = () => {
                    listenBtn.innerHTML = '<i class="ph ph-speaker-high text-lg"></i> Listen';
                };
                
                utterance.onerror = () => {
                    listenBtn.innerHTML = '<i class="ph ph-speaker-high text-lg"></i> Listen';
                    showError("An error occurred while playing audio.");
                };

                window.speechSynthesis.speak(utterance);
            });
        });
    </script>
</body>
</html>
